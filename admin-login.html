<!DOCTYPE html>
<html lang="es-CO" class="is-preparacion">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://bkzyaiamlhlbsggsoijk.supabase.co; font-src 'self'; connect-src 'self' https://bkzyaiamlhlbsggsoijk.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.google.com https://maps.google.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="color-scheme" content="dark">
  <title>Acceso — La Mansión Barber Shop</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <main class="panel-cerrado" data-panel-cerrado>
    <h1>No disponible por ahora</h1>
  </main>
  <script src="js/pwa.js"></script>
  <div class="offline-screen" data-offline role="status">
    <p>Sin conexión. Conéctate para ver tus citas.</p>
  </div>
  <main class="login-main">
    <div class="login-card">
      <a class="logo" href="index.html">
        <img src="assets/logo/logo-256.webp" width="256" height="124" alt="La Mansión Barber Shop">
      </a>
      <p class="etiqueta">Panel</p>
      <h1>Acceso</h1>
      <p>Solo para el equipo de la barbería.</p>
      <form data-login>
        <label class="campo">Correo
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label class="campo">Contraseña
          <span class="clave-fila">
            <input name="password" type="password" autocomplete="current-password" required>
            <button class="clave-ver" type="button" data-ver-clave aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
          </span>
        </label>
        <p class="form-error" data-login-error role="alert" hidden></p>
        <p class="login-codigo" data-login-codigo hidden></p>
        <button class="btn btn-block" type="submit" data-login-submit>Entrar</button>
        <button class="btn btn-sec btn-block" type="button" data-login-reintentar hidden>Reintentar</button>
      </form>
    </div>
  </main>
  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
