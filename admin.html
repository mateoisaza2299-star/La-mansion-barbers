<!DOCTYPE html>
<html lang="es-CO" class="is-preparacion">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="color-scheme" content="dark">
  <title>Panel — La Mansión Barber Shop</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <main class="panel-cerrado" data-panel-cerrado>
    <h1>No disponible por ahora</h1>
  </main>
  <script src="js/pwa.js"></script>
  <div class="offline-screen" data-offline role="status">
    <p>Sin conexión. Conéctate para ver tus citas.</p>
  </div>
  <div class="pa">
    <aside class="pa-lado">
      <a class="logo" href="index.html">
        <img src="assets/logo/logo-256.webp" width="256" height="124" alt="La Mansión Barber Shop">
      </a>
      <nav class="pa-nav" aria-label="Secciones del panel" data-nav="lado"></nav>
    </aside>
    <div class="pa-cuerpo">
      <header class="pa-top">
        <a class="logo pa-logo" href="index.html">
          <img src="assets/logo/logo-256.webp" width="256" height="124" alt="La Mansión Barber Shop">
        </a>
        <div>
          <p class="pa-saludo" data-saludo>Buenos días</p>
          <p class="pa-correo" data-correo></p>
        </div>
        <div class="pa-top-acciones">
          <button class="btn btn-sec" type="button" data-sonido aria-pressed="true">Sonido</button>
          <button class="btn btn-sec" type="button" data-avisos>Activar avisos</button>
          <button class="btn btn-sec" type="button" data-install hidden>Instalar app</button>
          <button class="btn" type="button" data-salir>Salir</button>
        </div>
      </header>
      <p class="form-error" data-pa-error role="alert" hidden></p>
      <p class="pa-aviso" data-servicios-aviso hidden>Hay servicios inactivos. Revísalos y actívalos antes de ofrecerlos.</p>

      <section data-panel="agenda" aria-label="Agenda">
        <div class="pa-controles">
          <label class="campo">Sede <select data-agenda-sede></select></label>
          <label class="campo">Fecha <input type="date" data-agenda-fecha></label>
          <div class="choice" role="group" aria-label="Vista">
            <button type="button" data-agenda-modo="dia" aria-pressed="true">Día</button>
            <button type="button" data-agenda-modo="semana" aria-pressed="false">Semana</button>
          </div>
          <label class="campo pa-solo-movil">Barbero <select data-agenda-barbero></select></label>
          <button class="btn" type="button" data-nueva>Nueva cita</button>
          <button class="btn btn-sec" type="button" data-imprimir>Imprimir agenda del día</button>
        </div>
        <div data-agenda aria-busy="true"></div>
      </section>

      <section data-panel="reservas" hidden aria-label="Reservas">
        <div class="pa-controles">
          <label class="campo">Buscar <input type="search" data-buscar placeholder="Nombre, celular o número" autocomplete="off"></label>
          <label class="campo">Desde <input type="date" data-filtro-desde></label>
          <label class="campo">Hasta <input type="date" data-filtro-hasta></label>
          <label class="campo">Barbero <select data-filtro-barbero></select></label>
          <label class="campo">Estado <select data-filtro-estado></select></label>
          <label class="campo">Servicio <select data-filtro-servicio></select></label>
          <button class="btn btn-sec" type="button" data-csv>Exportar a CSV</button>
        </div>
        <div data-reservas-lista aria-busy="true"></div>
      </section>

      <section data-panel="equipo" hidden aria-label="Equipo y horarios">
        <div data-solo="dueno">
          <h2>Sedes</h2>
          <form class="pa-form" data-sede-form>
            <input type="hidden" name="id">
            <label class="campo">Nombre <input name="nombre" required maxlength="80"></label>
            <label class="campo">Dirección <input name="direccion" required maxlength="160"></label>
            <label class="campo">Teléfono <input name="telefono" maxlength="20"></label>
            <label class="campo">Orden <input name="orden" type="number" min="0" value="1"></label>
            <label class="reserva-check"><input name="activa" type="checkbox" checked> Activa</label>
            <button class="btn" type="submit">Guardar sede</button>
          </form>
          <div data-sedes></div>
          <h2>Barberos</h2>
          <form class="pa-form" data-barbero-form>
            <input type="hidden" name="id">
            <label class="campo">Nombre <input name="nombre" required maxlength="80"></label>
            <label class="campo">Especialidad <input name="especialidad" maxlength="120"></label>
            <label class="campo">Sede <select name="sede_id" required></select></label>
            <label class="campo">Foto <select name="foto" data-barbero-foto></select></label>
            <div data-barbero-servicios></div>
            <label class="campo">Orden <input name="orden" type="number" min="0" value="1"></label>
            <label class="reserva-check"><input name="activo" type="checkbox" checked> Activo</label>
            <button class="btn" type="submit">Guardar barbero</button>
          </form>
          <div data-barberos></div>
        </div>
        <h2>Horarios</h2>
        <label class="campo">Barbero <select data-horario-barbero></select></label>
        <div class="pa-copiar">
          <label class="campo">Copiar desde <select data-copiar-desde></select></label>
          <div data-copiar-dias class="chips"></div>
          <button class="btn btn-sec" type="button" data-copiar>Copiar a otros días</button>
        </div>
        <div data-horario-editor></div>
        <button class="btn" type="button" data-horario-guardar>Guardar horarios</button>
        <h2>Bloqueos</h2>
        <form class="pa-form" data-bloqueo-form>
          <label class="campo">Sede <select name="sede_id" data-bloqueo-sede required></select></label>
          <label class="campo">Barbero <select name="barbero_id" data-bloqueo-barbero></select></label>
          <label class="campo">Fecha <input type="date" name="fecha" data-bloqueo-fecha required></label>
          <label class="reserva-check"><input type="checkbox" name="todo_dia" data-bloqueo-dia checked> Todo el día</label>
          <div class="pa-horas-bloqueo" data-bloqueo-horas hidden>
            <label class="campo">Desde <input type="time" name="desde" value="09:00"></label>
            <label class="campo">Hasta <input type="time" name="hasta" value="13:00"></label>
          </div>
          <label class="campo">Motivo <input name="motivo" data-bloqueo-motivo maxlength="180"></label>
          <p class="form-error" data-bloqueo-error role="alert" hidden></p>
          <button class="btn" type="submit" data-bloqueo-guardar>Guardar bloqueo</button>
        </form>
        <div data-bloqueos></div>
      </section>

      <section data-panel="servicios" hidden aria-label="Servicios">
        <h2>Servicios</h2>
        <form class="pa-form" data-servicio-form>
          <input type="hidden" name="id">
          <label class="campo">Categoría <input name="categoria" required maxlength="60"></label>
          <label class="campo">Nombre <input name="nombre" required maxlength="80"></label>
          <label class="campo">Descripción <input name="descripcion" maxlength="180"></label>
          <label class="campo">Precio <input name="precio" inputmode="numeric" placeholder="Vacío si se consulta"></label>
          <label class="campo">Duración (min) <input name="duracion_min" type="number" min="5" max="480" required value="30"></label>
          <label class="reserva-check"><input name="cuenta_fidelidad" type="checkbox"> Cuenta para fidelidad</label>
          <label class="campo">Orden <input name="orden" type="number" min="0" value="1"></label>
          <label class="reserva-check"><input name="activo" type="checkbox"> Activo</label>
          <button class="btn" type="submit">Guardar servicio</button>
        </form>
        <div data-servicios></div>
      </section>

      <section data-panel="fidelidad" hidden aria-label="Fidelidad">
        <h2>Fidelidad</h2>
        <form class="pa-form" data-fid-form>
          <label class="campo">Celular <input type="tel" data-fid-admin inputmode="numeric" maxlength="12" required></label>
          <button class="btn" type="submit">Buscar</button>
        </form>
        <div data-fid-resultado></div>
      </section>

      <section data-panel="resumen" hidden aria-label="Resumen">
        <div class="choice" role="group" aria-label="Periodo">
          <button type="button" data-periodo="hoy" aria-pressed="true">Hoy</button>
          <button type="button" data-periodo="7" aria-pressed="false">7 días</button>
          <button type="button" data-periodo="30" aria-pressed="false">30 días</button>
          <button type="button" data-periodo="rango" aria-pressed="false">Personalizado</button>
        </div>
        <div class="pa-controles" data-rango hidden>
          <label class="campo">Desde <input type="date" data-desde></label>
          <label class="campo">Hasta <input type="date" data-hasta></label>
        </div>
        <div class="pa-tarjetas" data-resumen-tarjetas></div>
        <div class="pa-graficos" data-resumen-graficos></div>
      </section>

      <section data-panel="ajustes" hidden aria-label="Ajustes">
        <h2>Ajustes</h2>
        <form class="pa-form" data-ajustes>
          <label class="reserva-check"><input name="reservas_activas" type="checkbox"> Reservas en línea activas</label>
          <label class="campo">Paso entre horas (min) <input name="paso_min" type="number" min="5" max="180" required></label>
          <label class="campo">Anticipación mínima (min) <input name="anticipacion_min" type="number" min="0" max="1440" required></label>
          <label class="campo">Días de anticipación máxima <input name="dias_max" type="number" min="1" max="90" required></label>
          <label class="campo">Plazo para cancelar (min) <input name="cancelar_min" type="number" min="0" max="10080" required></label>
          <label class="reserva-check"><input name="fidelidad_activa" type="checkbox"> Fidelidad activa</label>
          <label class="campo">Meta de fidelidad <input name="fidelidad_meta" type="number" min="1" max="50" required></label>
          <label class="campo">Versión de la política <input name="politica_version" maxlength="40" required></label>
          <p class="form-error" data-ajustes-error role="alert" hidden></p>
          <button class="btn" type="submit">Guardar ajustes</button>
        </form>
      </section>
    </div>
  </div>
  <nav class="pa-tabs" aria-label="Secciones del panel" data-nav="tabs"></nav>

  <div class="pa-modal" data-confirmar hidden>
    <div class="pa-modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmar-texto">
      <p id="confirmar-texto" data-confirmar-texto></p>
      <div class="cita-acciones">
        <button class="btn" type="button" data-confirmar-si>Sí</button>
        <button class="btn btn-sec" type="button" data-confirmar-no>No</button>
      </div>
    </div>
  </div>

  <div class="pa-modal" data-cita-modal hidden>
    <div class="pa-modal-card" role="dialog" aria-modal="true" aria-labelledby="cita-modal-titulo">
      <h2 id="cita-modal-titulo">Cita</h2>
      <div data-cita-modal-cuerpo></div>
      <button class="btn btn-sec" type="button" data-cita-cerrar>Cerrar</button>
    </div>
  </div>

  <div class="pa-modal" data-nueva-modal hidden>
    <div class="pa-modal-card" role="dialog" aria-modal="true" aria-labelledby="nueva-titulo">
      <h2 id="nueva-titulo">Nueva cita</h2>
      <form data-nueva-form>
        <label class="campo">Sede <select name="sede" required></select></label>
        <label class="campo">Servicio <select name="servicio" required></select></label>
        <label class="campo">Barbero <select name="barbero" required></select></label>
        <label class="campo">Fecha <input type="date" name="fecha" required></label>
        <label class="campo">Hora <select name="hora" required></select></label>
        <label class="campo">Nombre <input name="nombre" required maxlength="80"></label>
        <label class="campo">Celular <input name="celular" type="tel" inputmode="numeric" required maxlength="12"></label>
        <p class="ayuda">Se guarda la nota «Autorización verbal».</p>
        <p class="form-error" data-nueva-error role="alert" hidden></p>
        <div class="cita-acciones">
          <button class="btn" type="submit">Crear cita</button>
          <button class="btn btn-sec" type="button" data-nueva-cerrar>Cerrar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="install-guide" data-install-guide hidden>
    <div class="install-guide-card" role="dialog" aria-modal="true" aria-labelledby="install-title">
      <h2 id="install-title">Instalar app</h2>
      <button class="btn" type="button" data-install-close>Listo</button>
    </div>
  </div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
